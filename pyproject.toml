[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-save-cloud-sync"
version = "0.9.3"
description = "Windows desktop tool that watches game save folders and syncs them to cloud storage backends."
readme = "CONTRIBUTING.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "game-save-cloud-sync contributors" }]
keywords = ["game-save", "cloud-backup", "save-sync", "steam", "windows"]

dependencies = [
    "watchdog>=4.0.0",          # filesystem watcher; on Windows uses ReadDirectoryChangesW
    "httpx>=0.27.0",            # async HTTP for provider adapters
    "pydantic>=2.7.0",          # config + model validation
    "tomli-w>=1.0.0",           # write local config back
    "keyring>=25.0.0",          # Windows Credential Manager for provider tokens
    "structlog>=24.1.0",        # structured JSON logs
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
gsync = "game_save_cloud_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["game_save_cloud_sync*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true